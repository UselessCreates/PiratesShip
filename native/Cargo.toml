[package]
name = "piratesship"
version = "0.1.0"
edition = "2021"
description = "PiratesShip - recreate any site, app or game"
license = "MIT"

[[bin]]
name = "PiratesShip"
path = "src/main.rs"

[dependencies]
tao = "0.34"
wry = "0.57"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
